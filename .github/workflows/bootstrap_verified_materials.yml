name: Bootstrap verified research materials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap_verified_materials.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download pinned verified materials
        shell: bash
        run: |
          set -euo pipefail

          if [ -f data/verified_replication_dataset.csv ]; then
            echo "Verified materials are already present; nothing to bootstrap."
            exit 0
          fi

          SRC="https://raw.githubusercontent.com/krish533/tech-transfer-paper-2/verified-cross-repo-replication-2026-09-25/P2_replication_package"

          mkdir -p data code replication manuscript results/tables results/figures

          curl -fsSL "$SRC/data/verified_replication_dataset.csv" -o data/verified_replication_dataset.csv
          curl -fsSL "$SRC/data/merged_autm.csv" -o data/merged_autm.csv
          curl -fsSL "$SRC/code/replication.py" -o code/replication.py
          curl -fsSL "$SRC/code/run_all.py" -o code/run_all.py
          curl -fsSL "$SRC/code/verify_cross_repo.py" -o replication/verify_cross_repo.py
          curl -fsSL "$SRC/paper_outputs/logs/cross_repo_verification.md" -o replication/cross_repo_verification.md
          curl -fsSL "$SRC/paper_outputs/logs/cross_repo_verification.json" -o replication/cross_repo_verification.json
          curl -fsSL "$SRC/paper_outputs/logs/replication_output.txt" -o replication/paper2_replication_output.txt
          curl -fsSL "$SRC/requirements.txt" -o requirements.txt
          curl -fsSL "$SRC/paper_outputs/manuscript/manuscript.tex" -o manuscript/paper2_verified_starting_point.tex

          echo "de5377b98c1261c5de9a5b4df21efb86af04bbdce28cb3676ec37c61456fcdf6  data/verified_replication_dataset.csv" | sha256sum -c -
          echo "070f10179b34a0730d1f09ea3322d21e8f32e20d3036760df2adfef182aa2d4b  data/merged_autm.csv" | sha256sum -c -

      - name: Write repository documentation
        shell: bash
        run: |
          set -euo pipefail

          cat > data/README.md <<'EOF'
          # Data

          ## `verified_replication_dataset.csv`

          The principal analysis-ready dataset for the updated paper. It contains 3,507 observations and 46 variables, including cleaned technology-transfer outcomes, PCSI and related text indices, calendar-year lags, institutional controls, source-commit provenance, and a row-level Paper 1 verification flag.

          SHA-256: `de5377b98c1261c5de9a5b4df21efb86af04bbdce28cb3676ec37c61456fcdf6`

          ## `merged_autm.csv`

          Frozen Paper 2 merged input retained so the legacy Paper 2 replication code can be rerun exactly.

          SHA-256: `070f10179b34a0730d1f09ea3322d21e8f32e20d3036760df2adfef182aa2d4b`

          Do not manually edit either CSV. Any revised analysis dataset should be generated by code and documented separately.
          EOF

          cat > code/README.md <<'EOF'
          # Code

          `replication.py` and `run_all.py` are the verified Paper 2 analysis programs carried into this repository as the empirical benchmark. They operate on `data/merged_autm.csv`.

          New updated-paper analyses should be added as separate, clearly named scripts rather than silently changing the frozen benchmark code. This preserves an auditable distinction between reproduced results and new specifications.
          EOF

          cat > replication/README.md <<'EOF'
          # Replication and provenance

          This directory preserves the cross-repository audit connecting Paper 1 measurement data to Paper 2 outcomes.

          - `verify_cross_repo.py`: audit/build script used for the September 25, 2026 verification.
          - `cross_repo_verification.md`: human-readable audit report.
          - `cross_repo_verification.json`: machine-readable audit record.
          - `paper2_replication_output.txt`: complete verified Paper 2 console output.

          Pinned source commits:

          - Paper 1: `25a9472b34334825b6d6c6a334f5b88eb00695b5`
          - Paper 2: `88cf4a1c02540b136adb8beaa35e212625ac755e`
          EOF

          cat > manuscript/README.md <<'EOF'
          # Manuscript

          `paper2_verified_starting_point.tex` is a frozen starting-point copy of the verified Paper 2 manuscript.

          The active updated-paper manuscript should be developed separately (for example, `main.tex`) so changes in framing, identification, results, and robustness can be tracked against the verified benchmark.
          EOF

          cat > results/README.md <<'EOF'
          # Results

          Generated outputs for the updated paper belong here.

          - `tables/`: manuscript tables and machine-readable table sources.
          - `figures/`: manuscript figures.

          Whenever practical, outputs should be generated by scripts rather than edited by hand.
          EOF

          touch results/tables/.gitkeep results/figures/.gitkeep

          cat > .gitignore <<'EOF'
          .venv/
          venv/
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .mypy_cache/
          .ipynb_checkpoints/
          .DS_Store
          Thumbs.db
          EOF

      - name: Commit bootstrapped materials
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data code replication manuscript results requirements.txt .gitignore
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Bootstrap verified paper data, code, and provenance"
          git push
