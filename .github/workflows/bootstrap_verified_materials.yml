name: Verify frozen research materials

on:
  push:
    branches: [main]
    paths:
      - 'data/verified_replication_dataset.csv'
      - 'data/merged_autm.csv'
      - '.github/workflows/bootstrap_verified_materials.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/verified_replication_dataset.csv'
      - 'data/merged_autm.csv'
      - '.github/workflows/bootstrap_verified_materials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify frozen file checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f data/verified_replication_dataset.csv
          test -f data/merged_autm.csv
          echo "de5377b98c1261c5de9a5b4df21efb86af04bbdce28cb3676ec37c61456fcdf6  data/verified_replication_dataset.csv" | sha256sum -c -
          echo "070f10179b34a0730d1f09ea3322d21e8f32e20d3036760df2adfef182aa2d4b  data/merged_autm.csv" | sha256sum -c -

      - name: Verify frozen benchmark structure
        shell: bash
        run: |
          set -euo pipefail
          test -f code/replication.py
          test -f code/run_all.py
          test -f replication/verify_cross_repo.py
          test -f replication/cross_repo_verification.md
          test -f replication/cross_repo_verification.json
          test -f manuscript/paper2_verified_starting_point.tex
          echo "Frozen source materials verified; this workflow never rewrites repository content."
