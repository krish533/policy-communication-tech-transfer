name: Validate September 25 revision design

on:
  push:
    branches: [sept25-revision-baseline]
    paths:
      - 'code/sept25_diagnostics.py'
      - 'code/revision_event_study.py'
      - 'code/revision_replication.py'
      - 'data/revision_codes_manual.csv'
      - '.github/workflows/sept25_revision_check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reconcile September 25 source data
        run: python code/sept25_diagnostics.py

      - name: Run canonical September 25 replication
        run: python code/revision_replication.py

      - name: Commit reproduced Table 3 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/table3_reproduced.csv results/table3_reproduced.json
          if git diff --cached --quiet; then
            echo "No generated-result changes to commit."
            exit 0
          fi
          git commit -m "Update reproduced September 25 Table 3 results"
          git push
